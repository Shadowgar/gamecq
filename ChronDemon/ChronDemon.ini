[ChronDemon]

metaServer=127.0.0.1
metaServerPort=9000
chatRoom=1
user=
password=

logFile=./logs/ChronDemon.log

mday=*
month=*
wday=*
hour=*
minute=+5

warningTime=0
warningMessage=Shutting down for system maintence
execute=RotateLogs 30 ./logs/
exit=1
exitCode=-2

